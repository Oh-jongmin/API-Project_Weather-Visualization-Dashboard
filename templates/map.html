<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>📍 실시간 날씨 시각화 대시보드</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"></script>
  <link rel="stylesheet" href="/static/js/map.css" />
</head>
<body>
  <header>
    <h2>📍 실시간 날씨 시각화</h2>
    <div style="text-align:center; margin: 10px;">
      <input id="searchInput" list="autoList" placeholder="예: 강남구, 종로구, 도봉로 170길" style="padding:6px; width:220px;">
      <datalist id="autoList"></datalist>
      <button id="searchBtn">🔍 검색</button>
      <button id="resetBtn">📍 내 위치</button>
    </div>
    <div id="addressDisplay" style="text-align:center; font-weight:bold; margin-bottom: 10px;"></div>
  </header>

  <!-- 🔥 산불 정보 페이지로 이동하는 버튼 -->
<button onclick="window.location.href='/fires'" style="position:absolute; top: 20px; right: 20px; z-index:1000; padding:10px 16px; background-color:#ff5722; color:white; border:none; border-radius:6px; font-weight:bold; cursor:pointer;">
  🔥 산불 정보 보기
</button>


  <div id="map" style="height: 400px;"></div>

  <section>
    <h3>📢 시간별 날씨 및 위험 알림</h3>
    <div id="alertContainer" class="card-grid"></div>
  </section>

  <script src="/static/js/map_location.js"></script>
</body>
</html>
